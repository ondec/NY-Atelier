ServerName localhost
ServerTokens Prod
ServerSignature Off
# Only the portal on loopback talks to Apache. Keep-alive would park each of the few PHP workers on an idle
# connection for KeepAliveTimeout seconds, so parallel API calls queued for ~5 s each.
KeepAlive Off
<VirtualHost 127.0.0.1:8080>
    DocumentRoot /srv/api/public
    <Directory /srv/api/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
