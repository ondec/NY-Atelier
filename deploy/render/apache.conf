ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost 127.0.0.1:8080>
    DocumentRoot /srv/api/public
    <Directory /srv/api/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
