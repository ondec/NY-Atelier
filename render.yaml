# TEMPORARY FREE PREVIEW. Database expires after 30 days; local uploads/charts
# are ephemeral. Keep private records out of this file and out of GitHub.
services:
  - type: web
    name: ny-atelier-preview
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: ny-atelier-preview-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: NY_RENDER_KEY
        generateValue: true
      - key: NY_HOSTED_PREVIEW
        value: "1"
      - key: NY_DEMO_API_ENABLED
        value: "false"
      # NY Workspace: every staff role signs in at one address and lands in their own space. Cloudflare CNAME
      # workspace -> ny-atelier-preview.onrender.com (DNS only), added as a custom domain in Render.
      # (The variable keeps its old name, NY_TEAM_ORIGIN.)
      # ny-atelier-preview.onrender.com keeps working too. Invitation, password-reset links and the email logo use it.
      - key: NY_TEAM_ORIGIN
        value: https://workspace.thenyatelier.com
      - key: NY_STAFF_PORTAL_URL
        value: https://workspace.thenyatelier.com
      # The public website, with the RTW shop inside it at /shop (portal src/proxy.ts), on its own address:
      # Cloudflare CNAME site -> ny-atelier-preview.onrender.com, Render's second custom domain.
      # At launch: change this to https://thenyatelier.com and remove NY_PUBLIC_SITES_NOINDEX.
      - key: NY_WEBSITE_ORIGIN
        value: https://site.thenyatelier.com
      - key: NY_PUBLIC_SITES_NOINDEX
        value: "1"
      # "1" serves the website under /home on the onrender.com address instead (old preview).
      - key: NY_PUBLIC_SITES_PREVIEW_PATHS
        value: "0"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # Microsoft 365 over HTTPS (Render Free blocks SMTP). The Entra app may send only as noreply@, enforced by
      # an Exchange Application RBAC scope. Tenant/client IDs and the secret are entered in the Render dashboard.
      # Until they are set, invitations report "failed" and show the owner a one-use link instead.
      - key: MAIL_MAILER
        value: microsoft-graph
      - key: MAIL_FROM_ADDRESS
        value: noreply@thenyatelier.com
      - key: MAIL_FROM_NAME
        value: NY Atelier
      - key: MICROSOFT_GRAPH_TENANT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_GRAPH_SENDER
        value: noreply@thenyatelier.com
      # Order emails (docs/ORDER_FLOWS.md): customers on main stages, the production manager when an order is sent to
      # production, and the shared order mailbox when production hands an order back or an online order arrives.
      - key: ORDER_UPDATE_EMAIL_ENABLED
        value: "true"
      - key: NY_FRONT_DESK_EMAIL
        value: ny@thenyatelier.com
      # Fitting photos/videos in a private Cloudflare R2 bucket (Render Free wipes this server's disk on restart).
      # All five are entered in the Render dashboard. Leave FITTINGS_STORAGE unset to keep files on the server disk.
      - key: FITTINGS_STORAGE
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: NY_PREVIEW_STAFF_PASSWORD
        generateValue: true
      - key: NY_PREVIEW_OWNER_EMAIL
        sync: false
      - key: NY_PREVIEW_MANAGER_EMAIL
        sync: false
      - key: NY_PREVIEW_RECEPTIONIST_EMAIL
        sync: false


databases:
  - name: ny-atelier-preview-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: ny_atelier_preview
    user: ny_atelier_preview
    ipAllowList: []
