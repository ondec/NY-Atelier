# TEMPORARY FREE PREVIEW. Database expires after 30 days; local uploads/charts
# are ephemeral. Keep private records out of this file and out of GitHub.
services:
  - type: web
    name: ny-atelier-preview
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: ny-atelier-preview-db
          property: connectionString
      - key: DB_SSLMODE
        value: require
      - key: NY_RENDER_KEY
        generateValue: true
      - key: NY_HOSTED_PREVIEW
        value: "1"
      - key: NY_DEMO_API_ENABLED
        value: "false"
      # Staff subdomains (Cloudflare CNAMEs to ny-atelier-preview.onrender.com, DNS only). The three NY_* workspace
      # values must be set together; sign-in on them uses a shared __Secure- cookie for thenyatelier.com.
      # ny-atelier-preview.onrender.com keeps working with its own host-only sign-in.
      - key: NY_STUDIO_ORIGIN
        value: https://studio.thenyatelier.com
      - key: NY_OFFICE_ORIGIN
        value: https://office.thenyatelier.com
      - key: NY_STAFF_COOKIE_DOMAIN
        value: thenyatelier.com
      # Public website and RTW store, served by this same service on their own addresses (portal src/proxy.ts).
      # Cloudflare CNAMEs home and store -> ny-atelier-preview.onrender.com (DNS only), added as custom domains
      # in Render like studio and office. Also used at build time for the links between the two sites.
      # On approval: https://thenyatelier.com and https://rtw.thenyatelier.com, and remove NY_PUBLIC_SITES_NOINDEX.
      - key: NY_WEBSITE_ORIGIN
        value: https://home.thenyatelier.com
      - key: NY_STORE_ORIGIN
        value: https://store.thenyatelier.com
      - key: NY_PUBLIC_SITES_NOINDEX
        value: "1"
      # Until home/store are added as custom domains (Render's free plan allows two, used by studio and office),
      # the sites are previews at https://ny-atelier-preview.onrender.com/home and /store. Set to "0" once the
      # domains are added, so each site uses its own address.
      - key: NY_PUBLIC_SITES_PREVIEW_PATHS
        value: "1"
      # Invitation, password-reset links and the email logo use the Studio address.
      - key: NY_STAFF_PORTAL_URL
        value: https://studio.thenyatelier.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # Microsoft 365 over HTTPS (Render Free blocks SMTP). The Entra app may send only as noreply@, enforced by
      # an Exchange Application RBAC scope. Tenant/client IDs and the secret are entered in the Render dashboard.
      # Until they are set, invitations report "failed" and show the owner a one-use link instead.
      - key: MAIL_MAILER
        value: microsoft-graph
      - key: MAIL_FROM_ADDRESS
        value: noreply@thenyatelier.com
      - key: MAIL_FROM_NAME
        value: NY Atelier
      - key: MICROSOFT_GRAPH_TENANT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_GRAPH_SENDER
        value: noreply@thenyatelier.com
      # Fitting photos/videos in a private Cloudflare R2 bucket (Render Free wipes this server's disk on restart).
      # All five are entered in the Render dashboard. Leave FITTINGS_STORAGE unset to keep files on the server disk.
      - key: FITTINGS_STORAGE
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: NY_PREVIEW_STAFF_PASSWORD
        generateValue: true
      - key: NY_PREVIEW_OWNER_EMAIL
        sync: false
      - key: NY_PREVIEW_MANAGER_EMAIL
        sync: false
      - key: NY_PREVIEW_RECEPTIONIST_EMAIL
        sync: false


databases:
  - name: ny-atelier-preview-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: ny_atelier_preview
    user: ny_atelier_preview
    ipAllowList: []
